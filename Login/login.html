<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | MedPortal</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="login_style.css">
  <!-- Tipografía (opcional, pero mejora el diseño) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="login.js" defer></script>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <!-- USO DE TEORÍA: Etiqueta img para el ícono -->
      <img src="../Images/logo.png" alt="Logo de MedPortal" class="logo-img">
      <h1>MedPortal</h1>
    </div>

    <form>
      <h2>Bienvenido</h2>

      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Iniciar Sesión</button>
      
      <p class="security-note">Acceso solo para administradores</p>
    </form>
  </div>
</body>
</html>
